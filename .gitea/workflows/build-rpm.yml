name: build-rpm

on:
  workflow_dispatch:
  push:
    tags:
      - 'openssl35-*'

concurrency:
  group: build-rpm-${{ gitea.ref }}
  cancel-in-progress: false

env:
  PKG: openssl35

jobs:
  build:
    name: build + sign + clean-room verify (openssl35)
    # host-mode runner: podman + git + node (upload-artifact@v3-hoz) kell rajta
    runs-on: ${{ vars.BUILD_RUNNER || 'rpm-build-host' }}
    timeout-minutes: 60
    steps:
      - name: Checkout (git, subpath-os Gitea esetén is működik)
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.extraHeader
          GIT_CONFIG_VALUE_0: "Authorization: token ${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          find . -mindepth 1 -delete
          git init -q .
          git remote add origin "${{ gitea.server_url }}/${{ gitea.repository }}.git"
          git fetch -q --depth=1 origin "${{ gitea.sha }}"
          git checkout -q --detach FETCH_HEAD

      - name: Forrás letöltése + SHA256 ellenőrzés
        run: bash packaging/bin/fetch-source.sh

      - name: Build (offline konténer, opcionális RPM aláírás)
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          BUILD_BASE_IMAGE: ${{ vars.BUILD_BASE_IMAGE }}
        run: bash packaging/bin/build.sh

      - name: Clean-room verify (ubi7, offline)
        env:
          VERIFY_IMAGE: ${{ vars.VERIFY_IMAGE }}
        run: bash packaging/bin/verify.sh

      - name: Artifact feltöltése
        uses: actions/upload-artifact@v3
        with:
          name: rpm-package-openssl35
          path: |
            out/*.rpm
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Publish a Gitea RPM registrybe (opcionális, csak tag)
        if: ${{ vars.PUBLISH_RPM == 'true' && startsWith(gitea.ref, 'refs/tags/') }}
        env:
          PACKAGES_USER: ${{ secrets.PACKAGES_USER }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          GITEA_OWNER: ${{ gitea.repository_owner }}
          GITEA_BASE_URL: ${{ vars.GITEA_BASE_URL || gitea.server_url }}
        run: bash packaging/bin/publish.sh
